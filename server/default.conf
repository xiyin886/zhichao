# 「知潮」站点 nginx 配置（服务器端鉴权版）
# 挂载到容器内 /etc/nginx/conf.d/；站点根目录 /usr/share/nginx/html 等于宿主机 /opt/zhichao（只读挂载）。
# 鉴权模型：受保护资源经 auth_request 子请求 /api/auth 校验 HttpOnly 会话 Cookie，
# 未登录一律 401；登录页外壳与口令门所需图片保持公开。

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    charset utf-8;
    server_tokens off;

    # 有 .gz 就直接发，没有则回落到运行时压缩。
    gzip_static on;
    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        text/xml
        application/json
        application/javascript
        application/xml;

    # ---------- 认证子请求（仅 nginx 内部可调用） ----------
    location = /api/auth {
        internal;
        proxy_pass http://zhichao-memory:8080/auth;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Host $host;
        proxy_set_header Cookie $http_cookie;
        proxy_set_header X-Forwarded-For $remote_addr;
    }

    # ---------- 登录 / 登出 / 会话探测 ----------
    location = /api/login {
        limit_except POST { deny all; }
        proxy_pass http://zhichao-memory:8080/login;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header Content-Type "application/json";
        proxy_read_timeout 30s;
    }

    location = /api/logout {
        limit_except POST { deny all; }
        proxy_pass http://zhichao-memory:8080/logout;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Content-Type "application/json";
        proxy_read_timeout 30s;
    }

    location = /api/session {
        limit_except GET { deny all; }
        proxy_pass http://zhichao-memory:8080/session;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    # ---------- 受保护的业务接口 ----------
    # 看板娘聊天：反代到后端 /chat，由后端注入站内数据库上下文再转发 Moonshot；
    # Moonshot 密钥只存在于后端环境变量，本配置不再持有，且必须登录才能调用。
    location = /api/kimi {
        auth_request /api/auth;
        limit_except POST { deny all; }

        proxy_pass http://zhichao-memory:8080/chat;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header Content-Type "application/json";
        proxy_set_header Connection "";
        proxy_set_header X-Forwarded-For $remote_addr;

        # SSE：关闭缓冲，逐块透传
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # 聊天记忆 JSON 存储：必须登录后才能访问；容器令牌由本配置注入，不暴露给前端。
    location = /api/memory {
        auth_request /api/auth;
        limit_except GET POST { deny all; }

        proxy_pass http://zhichao-memory:8080/memory;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Memory-Token "ad9fc32103cf688654a2a903711e70039591be180a8b15ff";
        proxy_set_header Content-Type "application/json";
        proxy_set_header Connection "";

        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    # ---------- 受保护的静态资源 ----------
    # 数据文件：核心产出，未登录不可读；每晚更新，要求每次回源确认。
    location /data/ {
        auth_request /api/auth;
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # 立绘、语音等专属素材：未登录不可读。
    location /assets/ {
        auth_request /api/auth;
        try_files $uri =404;
    }

    # 口令门页面自身需要的图片与站点图标：精确匹配优先级最高，保持公开。
    location = /assets/gate-pull-l.webp { try_files $uri =404; }
    location = /assets/gate-pull-r.webp { try_files $uri =404; }
    location = /assets/gate-swing.webp  { try_files $uri =404; }
    location = /assets/icon-192.png     { try_files $uri =404; }
    location = /assets/icon-512.png     { try_files $uri =404; }
    location = /assets/favicon-16.png   { try_files $uri =404; }
    location = /assets/favicon-32.png   { try_files $uri =404; }
    location = /assets/apple-touch-icon.png { try_files $uri =404; }

    # 第三方库：仅登录后加载。
    location /vendor/ {
        auth_request /api/auth;
        try_files $uri =404;
    }

    # ---------- 公开的页面外壳 ----------
    # index.html 只是 UI 外壳（已不含任何口令秘密），5 分钟浏览器缓存。
    location = / {
        add_header Cache-Control "public, max-age=300";
        try_files /index.html =404;
    }

    location = /index.html {
        add_header Cache-Control "public, max-age=300";
    }

    # 只服务实际存在的文件，不列目录、不猜路径
    location / {
        try_files $uri =404;
    }
}
